name: tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the tests
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: python -m unittest discover -s tests

  devflow:
    name: devflow (version bump, new comments, AI attribution, knowledge docs)
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: The version changes only in a release commit
        run: uv run --no-project python tools/devflow_checks.py version --base "$BASE" --head "$HEAD_SHA"

      - name: No new comment lines in the listed folders
        run: uv run --no-project python tools/devflow_checks.py comments --base "$BASE" --head "$HEAD_SHA"

      - name: No AI attribution where the project turned it off
        run: uv run --no-project python tools/devflow_checks.py attribution --base "$BASE" --head "$HEAD_SHA"

      - name: Every doc anchor names a file and a symbol in it
        run: uv run --no-project python tools/devflow_checks.py anchors

      - name: A change to a documented area updates its doc or says why not
        run: uv run --no-project python tools/devflow_checks.py docs --base "$BASE" --head "$HEAD_SHA"
